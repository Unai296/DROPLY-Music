<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DROPLY — Plataforma Multimedia</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ══════════════════════════════ TOP BAR ══════════════════════════════ -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a href="#" class="logo">DROPLY</a>
      <div class="topbar-actions">
        <button class="topbar-icon-btn" id="topbarSearchBtn" aria-label="Buscar">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ══════════════════════════════ PAGES ══════════════════════════════ -->
  <div class="pages-container" id="pagesContainer">

    <!-- PAGE: HOME -->
    <div class="page active" id="pageHome">
      <!-- Hero compacto -->
      <section class="hero-compact">
        <div class="hero-compact-bg"></div>
        <div class="hero-compact-content">
          <p class="hero-eyebrow">Streaming de calidad</p>
          <h1 class="hero-title">Implementacion de Música <em>en Desarrollo</em></h1>
          <p class="hero-sub">Descubre y escucha tu colección sin anuncios</p>
          <button class="btn-hero" id="heroExplore">Explorar ahora</button>
        </div>
      </section>

      <!-- Category pills -->
      <section class="cat-bar" id="catBar">
        <div class="cat-inner" id="catInner">
          <button class="cat-pill active" data-cat="all">Todo</button>
        </div>
      </section>

      <!-- Grid -->
      <main class="grid-section" id="gridSection">
        <div class="grid-header">
          <h2 class="section-title" id="sectionTitle">Todo el contenido</h2>
          <span class="count-badge" id="countBadge">0 items</span>
        </div>
        <div class="media-grid" id="mediaGrid"></div>
      </main>
    </div>

    <!-- PAGE: SEARCH -->
    <div class="page" id="pageSearch">
      <div class="search-page-header">
        <h2 class="search-page-title">Buscar</h2>
        <div class="search-page-input-wrap">
          <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
          <input type="text" id="searchInput" placeholder="Artistas, canciones, géneros…" class="search-page-input" autocomplete="off" />
          <button class="search-clear-btn" id="searchClear" style="display:none">✕</button>
        </div>
      </div>
      <div class="search-results-wrap">
        <div id="searchBrowse" class="search-browse">
          <p class="search-browse-label">Explorar géneros</p>
          <div class="genre-grid" id="genreGrid"></div>
        </div>
        <div id="searchResults" class="search-results-list" style="display:none"></div>
      </div>
    </div>



  <!-- ══════════════════════════════ MODAL PLAYER (ahora como sheet) ══════════════════════════════ -->
  <div class="now-playing-sheet" id="nowPlayingSheet">
    <div class="sheet-handle-wrap">
      <div class="sheet-handle"></div>
    </div>
    <button class="sheet-close-btn" id="sheetClose">
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="sheet-cover-wrap">
      <img class="sheet-cover" id="sheetCover" src="" alt="" />
    </div>
    <div class="sheet-info">
      <div class="sheet-text">
        <p class="sheet-category" id="sheetCategory"></p>
        <h2 class="sheet-title" id="sheetTitle">—</h2>
        <p class="sheet-artist" id="sheetArtist">—</p>
      </div>
      <button class="sheet-heart" id="sheetHeart" aria-label="Me gusta">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
    </div>
    <div class="sheet-progress-wrap">
      <div class="sheet-bar" id="sheetBar">
        <div class="sheet-fill" id="sheetFill"></div>
        <div class="sheet-thumb" id="sheetThumb"></div>
      </div>
      <div class="sheet-times">
        <span id="sheetCurrent">0:00</span>
        <span id="sheetDuration">0:00</span>
      </div>
    </div>
    <div class="sheet-controls">
      <button class="sheet-ctrl-btn" id="sheetShuffle" aria-label="Aleatório">
        <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      </button>
      <button class="sheet-ctrl-btn sheet-skip" id="sheetPrev" aria-label="Anterior">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="3" height="16"/></svg>
      </button>
      <button class="sheet-play-btn" id="sheetPlay" aria-label="Play/Pause">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,3 19,12 5,21"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none"><rect x="6" y="3" width="4" height="18"/><rect x="14" y="3" width="4" height="18"/></svg>
      </button>
      <button class="sheet-ctrl-btn sheet-skip" id="sheetNext" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,20 15,12 5,4"/><rect x="16" y="4" width="3" height="16"/></svg>
      </button>
      <button class="sheet-ctrl-btn" id="sheetRepeat" aria-label="Repetir">
        <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>
    <div class="sheet-volume-wrap">
      <svg viewBox="0 0 24 24" class="vol-icon"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.01" value="1" />
    </div>
    <audio id="mainAudio"></audio>
  </div>

  <!-- ══════════════════════════════ MINI PLAYER (bottom bar) ══════════════════════════════ -->
  <div class="mini-player" id="miniPlayer">
    <div class="mini-player-inner" id="miniPlayerExpand">
      <div class="mini-cover">
        <img id="miniCover" src="" alt="" />
      </div>
      <div class="mini-info">
        <span class="mini-title" id="miniTitle">—</span>
        <span class="mini-artist" id="miniArtist">—</span>
      </div>
      <div class="mini-progress-line">
        <div class="mini-progress-fill" id="miniProgressFill"></div>
      </div>
    </div>
    <div class="mini-controls">
      <button class="mini-ctrl" id="miniPlay" aria-label="Play/Pause">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,3 19,12 5,21"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none"><rect x="6" y="3" width="4" height="18"/><rect x="14" y="3" width="4" height="18"/></svg>
      </button>
      <button class="mini-ctrl" id="miniNext" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,20 15,12 5,4"/><rect x="16" y="4" width="3" height="16"/></svg>
      </button>
    </div>
  </div>

  <!-- ══════════════════════════════ BOTTOM NAV ══════════════════════════════ -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="bnav-btn active" data-page="pageHome" aria-label="Inicio">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Inicio</span>
    </button>
    <button class="bnav-btn" data-page="pageSearch" aria-label="Buscar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
      <span>Buscar</span>
    </button>

  <script src="script.js"></script>
</body>
</html>
