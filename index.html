<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DROPLY — Plataforma Multimedia</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ══════════════════════════════ NAVBAR ══════════════════════════════ -->
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="#" class="logo">DROPLY</a>

      <nav class="nav-links" id="navLinks">
        <a href="#" class="nav-link active" data-filter="all">Inicio</a>
        <a href="#" class="nav-link" data-filter="music">Música</a>
        <a href="#" class="nav-link" data-filter="categories">Géneros</a>
      </nav>

      <div class="nav-right">
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="Buscar…" class="search-input" />
          <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
        </div>
        <button class="hamburger" id="hamburger" aria-label="Menú">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ══════════════════════════════ HERO ══════════════════════════════ -->
  <section class="hero" id="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">Streaming de calidad</p>
      <h1 class="hero-title">Películas(próximamente) & Música<br /><em>Infinita</em></h1>
      <p class="hero-sub">Descubre, escucha y disfruta de una colección curada de cine y audio en un solo lugar elegante y oscuro.</p>
      <button class="btn-hero" id="heroExplore">Explorar ahora</button>
    </div>
    <div class="hero-visual">
      <div class="hero-cards-float">
        <div class="hc hc1">
          <div class="hc-icon">▶</div>
          <div class="hc-text">Películas</div>
        </div>
        <div class="hc hc2">
          <div class="hc-icon">♪</div>
          <div class="hc-text">Música</div>
        </div>
        <div class="hc hc3">
          <div class="hc-circle">✨</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ══════════════════════════════ CATEGORIES BAR ══════════════════════════════ -->
  <section class="cat-bar" id="catBar">
    <div class="cat-inner">

      <!-- más categorías generadas dinámicamente -->
    </div>
  </section>

  <!-- ══════════════════════════════ GRID ══════════════════════════════ -->
  <main class="grid-section" id="gridSection">
    <div class="grid-header">
      <h2 class="section-title" id="sectionTitle">Todo el contenido</h2>
      <span class="count-badge" id="countBadge">0 items</span>
    </div>
    <div class="media-grid" id="mediaGrid"></div>
  </main>

  <!-- ══════════════════════════════ MODAL PLAYER ══════════════════════════════ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-inner" id="modalInner"></div>
    </div>
  </div>

  <!-- ══════════════════════════════ BOTTOM PLAYER ══════════════════════════════ -->
  <div class="bottom-player" id="bottomPlayer">
    <div class="bp-cover">
      <img src="" alt="" id="bpCover" />
    </div>
    <div class="bp-info">
      <span class="bp-title" id="bpTitle">—</span>
      <span class="bp-artist" id="bpArtist">—</span>
    </div>
    <div class="bp-controls">
      <button class="bp-btn" id="bpPrev" title="Anterior">&#9664;&#9664;</button>
      <button class="bp-btn bp-play" id="bpPlay" title="Play/Pause">&#9654;</button>
      <button class="bp-btn" id="bpNext" title="Siguiente">&#9654;&#9654;</button>
    </div>
    <div class="bp-progress-wrap">
      <span class="bp-time" id="bpCurrent">0:00</span>
      <div class="bp-bar" id="bpBar">
        <div class="bp-fill" id="bpFill"></div>
        <div class="bp-thumb" id="bpThumb"></div>
      </div>
      <span class="bp-time" id="bpDuration">0:00</span>
    </div>
    <button class="bp-close-btn" id="bpClose" title="Cerrar">✕</button>
    <!-- hidden audio element -->
    <audio id="mainAudio"></audio>
  </div>

  <!-- ══════════════════════════════ FOOTER ══════════════════════════════ -->

    <div class="footer-bottom">
      <p>©POWERED BY Nova's Corporation</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
